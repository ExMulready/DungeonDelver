# Full self-hosted stack: app + local model + database. Free and offline.
#
#   docker compose up --build
#
# Heads up on memory. This host has 7.8 GB total and the default model wants
# ~2.7 GB of it. If the machine starts swapping, drop OLLAMA_MODEL to
# qwen3:1.7b in .env. For day-to-day development prefer docker-compose.dev.yml,
# which runs only Postgres and Ollama and leaves Next.js on the host.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: delver
      POSTGRES_PASSWORD: delver
      POSTGRES_DB: dungeondelver
    # Tuned down hard — this database holds a handful of rows per campaign and
    # every megabyte here is a megabyte the model cannot have.
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=30
      -c effective_cache_size=192MB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delver -d dungeondelver"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # One model resident, one request at a time. On a CPU-only host, parallel
      # requests do not go faster — they just multiply the KV cache.
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama --version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: pulls the narrator model on first boot, then exits. Re-running is
  # cheap because Ollama skips layers it already has.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b}
    entrypoint: ["/bin/sh", "/init-model.sh"]
    volumes:
      - ./ollama/init-model.sh:/init-model.sh:ro
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://delver:delver@postgres:5432/dungeondelver
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      CHRONICLE_STORE: ${CHRONICLE_STORE:-both}
      CHRONICLE_DIR: /data/campaigns
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — generate one with: openssl rand -base64 32}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    ports:
      - "3000:3000"
    volumes:
      # Bind mount, not a named volume, so the chronicles are readable from the
      # host: cat data/campaigns/<id>/chronicle.md
      - ./data:/data

volumes:
  pgdata:
  ollama:
